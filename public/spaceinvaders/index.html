<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <div id="hud">
      <span>SCORE: <span id="score">0</span></span>
      <span>LEVEL: <span id="level">1</span></span>
      <span>LIVES: <span id="lives">❤️ ❤️ ❤️</span></span>
      <span>XP: <span id="xp-label">0/50</span></span>
      <span>🪙 <span id="coins">0</span></span>
      <span>BEST: <span id="highscore">0</span></span>
    </div>

    <!-- XP bar -->
    <div id="xp-bar-wrap"><div id="xp-bar"></div></div>

    <canvas id="gameCanvas"></canvas>

    <div id="touch-controls">
      <button id="btn-left"  class="touch-btn">◀</button>
      <button id="btn-fire"  class="touch-btn fire-btn">🔥</button>
      <button id="btn-right" class="touch-btn">▶</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
